<svg viewBox="0 0 640 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="synapseHQ">
  <!-- Single-color synapse mark: calm enough for the shell, distinctive enough to own. -->
  <g transform="translate(30,30)" fill="none" stroke="#4255ff" stroke-linecap="round">
    <line x1="30" y1="25" x2="90" y2="25" stroke-width="4"/>
    <line x1="30" y1="25" x2="30" y2="70" stroke-width="4"/>
    <line x1="30" y1="70" x2="90" y2="70" stroke-width="4"/>
    <line x1="90" y1="70" x2="90" y2="115" stroke-width="4"/>
    <line x1="30" y1="115" x2="90" y2="115" stroke-width="4"/>
    <line x1="60" y1="47" x2="30" y2="70" stroke-width="3" opacity="0.6"/>
    <line x1="60" y1="92" x2="90" y2="70" stroke-width="3" opacity="0.6"/>
  </g>

  <g transform="translate(30,30)" fill="#4255ff">
    <circle cx="30" cy="25" r="10"/>
    <circle cx="90" cy="25" r="7"/>
    <circle cx="30" cy="70" r="7"/>
    <circle cx="90" cy="70" r="10"/>
    <circle cx="30" cy="115" r="10"/>
    <circle cx="90" cy="115" r="7"/>
  </g>

  <!-- The wordmark is larger now that the tagline is gone. -->
  <text x="175" y="122" font-family="'hurme_no2-webfont', 'Hurme Geometric Sans', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="78" font-weight="700" fill="#282e3e">synapse<tspan fill="#4255ff">HQ</tspan></text>
</svg>
