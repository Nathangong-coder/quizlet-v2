general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

# NOTE: `model_name` is a LOCAL ALIAS; `litellm_params.model` is the real
# upstream id. Do not copy the alias column into app code, and do not offer it
# as a default in the AI settings UI — the app talks to providers directly
# (src/lib/ai/providers.ts) and needs real ids. Copying aliases is exactly how
# `gemini-3-flash` ended up 404ing in production.
#
# This proxy is a LOCAL-DEV concern only. The app has no fallback chain of its
# own any more: model choice lives entirely in each user's `AiCredential`
# (+ optional `AiTaskRouting` pin), and failover is across credentials, not
# across model ids.
model_list:

  - model_name: gemini-3.6-flash
    litellm_params:
      model: gemini/gemini-3.6-flash
      api_key: os.environ/GOOGLE_API_KEY

  - model_name: gemini-3.5-flash
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GOOGLE_API_KEY

  - model_name: gemini-3.1-flash-lite
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GOOGLE_API_KEY

  - model_name: gemini-3.5-flash-lite
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GOOGLE_API_KEY

  - model_name: gemma-4-31b-it
    litellm_params:
      model: gemini/gemma-4-31b-it
      api_key: os.environ/GOOGLE_API_KEY

  - model_name: gemma-4-26b-a4b-it
    litellm_params:
      model: gemini/gemma-4-26b-a4b-it
      api_key: os.environ/GOOGLE_API_KEY

litellm_settings:
  drop_params: true
  # Proxy-only fallback chain. It has no counterpart in app code (the former
  # MODEL_FALLBACKS table is deleted) — do not "sync" the two.
  fallbacks:
    - gemini-3.6-flash:
        - gemini-3.5-flash
        - gemini-3.1-flash-lite
        - gemini-3.5-flash-lite
        - gemma-4-31b-it
    - gemini-3.5-flash:
        - gemini-3.1-flash-lite
        - gemini-3.5-flash-lite
        - gemma-4-31b-it
    - gemini-3.1-flash-lite:
        - gemini-3.5-flash-lite
        - gemma-4-31b-it
    - gemini-3.5-flash-lite:
        - gemma-4-31b-it
    - gemma-4-31b-it:
        - gemma-4-26b-a4b-it
